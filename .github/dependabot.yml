version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Action v7+ requires migrating the linter and its configuration to v2.
      - dependency-name: golangci/golangci-lint-action
        update-types: ["version-update:semver-major"]
